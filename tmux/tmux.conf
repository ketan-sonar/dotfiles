# GENERAL SETTINGS
set -g default-terminal "tmux-256color"
set -g focus-events on
set -sg escape-time 0
set -g mouse on
set -s extended-keys on
set -g extended-keys-format csi-u

# vi mode
setw -g mode-keys vi

# start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# PLUGINS
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "catppuccin/tmux"
set -g @plugin "tmux-plugins/tmux-battery"
set -g @plugin "omerxx/tmux-floax"

# catppuccin config

set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_status_background "#0a0a0f"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "

set -g @catppuccin_pane_status_enabled "yes"
set -g @catppuccin_pane_border_status "yes"
set -g @catppuccin_pane_active_border_style "##{?pane_in_mode,fg=#{@thm_peach},##{?pane_synchronized,fg=#{@thm_rosewater},fg=#{@thm_peach}}}"
set -g @catppuccin_pane_color "#{@thm_rosewater}"

run ~/.config/tmux/plugins/tmux/catppuccin.tmux

set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right ""
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# floax
set -g @floax-bind "-n M-j"
set -g @floax-width "75%"
set -g @floax-height "75%"
set -g @floax-border-color "magenta"
set -g @floax-text-color "default"
set -g @floax-change-path "true"

# KEYBINDINGS

# reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# navigation
bind-key -n M-h previous-window
bind-key -n M-l next-window
bind c new-window -c "#{pane_current_path}"

# TPM INITIALIZE (must be at the very bottom)
run "~/.config/tmux/plugins/tpm/tpm"
